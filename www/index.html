<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3864"><title>VATS Attendance</title>
<style>
:root{--navy:#1f3864;--blue:#1d5fd1;--green:#1e8e3e;--amber:#b7791f;--red:#c62828;--bg:#f3f5f9;--card:#fff;--tx:#1b2430;--mut:#5b6675}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}main{padding:16px;max-width:520px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}input{width:100%;font-size:17px;padding:12px;border:1px solid #c8d0dc;border-radius:10px}
button{font-size:17px;font-weight:600;border:0;border-radius:12px;padding:16px;width:100%;margin-top:12px;color:#fff;background:var(--blue)}
button.big{padding:26px;font-size:21px}button.green{background:var(--green)}button.red{background:var(--red)}button.ghost{background:#e6ebf4;color:var(--navy)}button:disabled{opacity:.5}
.banner{padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:14px}.ok{background:#e3f4e8;color:#14532d}.warn{background:#fff4d6;color:#7a4b00}.bad{background:#fde6e6;color:#8a1c1c}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:15px}.row span:first-child{color:var(--mut)}
.hist{border-top:1px solid #e5e9f0;padding:10px 0;font-size:14px}.hist:first-child{border-top:0}
img.thumb{width:100%;border-radius:10px;margin-top:8px}a{color:var(--blue)}.hidden{display:none}.small{font-size:12px;color:var(--mut)}
.timer{font-size:34px;font-weight:700;text-align:center;margin:6px 0;color:var(--navy)}
</style></head>
<body>
<header><b id="hdr">VATS Attendance</b><span id="who" class="small" style="color:#cfd9ee"></span></header>
<main id="app"></main>
<script src="config.js"></script><script src="app.js"></script>
</body></html>
