name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_url:
        description: "Google Apps Script web app URL (overrides the SERVER_URL repository variable)"
        required: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Run backend logic tests (a failure here is reported but does not stop the APK build)
        continue-on-error: true
        run: npm test

      - name: Set Google Apps Script URL in the app
        env:
          INPUT_URL: ${{ github.event.inputs.server_url }}
          VAR_URL: ${{ vars.SERVER_URL }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          URL="${INPUT_URL:-$VAR_URL}"
          if [ -n "$INPUT_URL" ]; then echo "Using URL typed into Run workflow";
          elif [ -n "$VAR_URL" ]; then echo "Using repository variable SERVER_URL"; fi
          if [ -z "$URL" ]; then
            URL=$(node -e "const m=require('fs').readFileSync('www/config.js','utf8').match(/SERVER_URL:\s*\"([^\"]+)\"/);process.stdout.write(m&&!/PASTE-YOUR-ID/.test(m[1])?m[1]:'')")
            [ -n "$URL" ] && echo "Using URL already saved in www/config.js"
          fi
          if [ -z "$URL" ]; then
            echo "Variable names this repository has: $(node -e "console.log(Object.keys(JSON.parse(process.env.ALL_VARS)).join(', ')||'(none)')")"
            echo "::error::No server URL found. Create a repository VARIABLE named exactly SERVER_URL (Settings > Secrets and variables > Actions > Variables), or edit www/config.js and paste your /exec URL, or type it into Run workflow."
            exit 1
          fi
          node scripts/set-server-url.js "$URL"

      - name: Create Android project
        run: |
          npx cap add android
          node scripts/patch-android.js
          npm run icons
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/VATS-Attendance-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VATS-Attendance-APK
          path: dist/*.apk
          retention-days: 30
